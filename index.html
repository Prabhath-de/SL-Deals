    <meta name="description" content="Find today's offers, bank card promotions and discounts from shops, restaurants, hotels and online stores across Sri Lanka." />

    <meta name="theme-color" content="#0B7A6E" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealFinder LK" />
    <meta property="og:title" content="DealFinder LK – Every offer in Sri Lanka, in one place" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Apply the saved colour theme before the page paints (no white flash in dark mode).
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>DealFinder LK needs JavaScript to show offers.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
